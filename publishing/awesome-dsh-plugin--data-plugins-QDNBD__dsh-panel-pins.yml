url: https://github.com/QDNBD/dsh-panel-pins
name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Keyboard-first sidebar panel launcher for DeepSeek Harness — stop opening the sidebar at all. Ctrl+K anywhere, type two letters, Enter: panels, third-party plugin entries and settings-only pages all live in one searchable grouped menu (hit highlighting, Alt+1..9 direct jumps, Recent/MRU). Also pin/top/hide/rename rows, drag-to-reorder with a live drop line, custom groups, named layout presets, icon-only mode, compact footer and a full Settings page with clipboard/file/drag-drop export. v1.4 bridges third-party plugins that only registered a Settings section into the menu as full pages. Display-layer only, no DOM surgery, clean uninstall, theme-token styling, widest host range (DSH >= 0.2.0-rc.1, Node >= 20). Install: dsh plugin add dsh-panel-pins."
  zh: "DeepSeek Harness 侧栏面板的键盘启动器——不必再打开侧栏：任意界面 Ctrl+K，打两个字回车，面板、第三方插件入口、只注册了设置页的插件页面全在同一个可搜索分组菜单里（命中高亮、Alt+1..9 直达、最近使用）。还可钉住/置顶/隐藏/重命名侧栏行、按住拖动排序（蓝色插入线指示落点）、自建分组、具名布局预设一键切换、仅图标模式、紧凑底部区，以及带剪贴板/文件/拖放三通道导出导入的完整设置页。v1.4 把只注册了设置页的第三方插件桥接成菜单里的整页入口。只改显示层，不做 DOM 手术，卸载零残留，主题 token 化，兼容区间最宽（DSH >= 0.2.0-rc.1 / Node >= 20）。安装：dsh plugin add dsh-panel-pins。"
