url: https://github.com/QDNBD/dsh-panel-pins
name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Keyboard-first sidebar panel launcher for DeepSeek Harness: a grouped Panels menu with in-menu search and hit highlighting, Alt+1..9 direct jumps and a Recent (MRU) group, mirrored by a Ctrl+K command palette — plus named layout presets, drag-to-reorder sidebar rows with a live drop line (right-click Move-to-front fallback), pin/top/hide/rename rows, custom panel groups, icon-only mode, a compact footer and a full Settings page. Deep 0.2.2-rc.3 integration: independent panel-list scrolling, pixel-aligned launcher rows, opt-in footer entry collection. Settings export/import via clipboard, file AND drag-drop. Display-layer only, clean uninstall, widest host range (DSH >= 0.2.0-rc.1). Install: dsh plugin add dsh-panel-pins."
  zh: "DeepSeek Harness 侧栏键盘效率型启动器：分组「面板」菜单带菜单内搜索与命中高亮、Alt+1..9 直达与最近使用（MRU），并镜像为 Ctrl+K 命令面板；支持具名布局预设、侧栏行直接拖拽排序（蓝色插入线实时指示，右键「移到最前」兜底）、钉住/置顶/隐藏/重命名、自定义分组、仅图标模式与紧凑底部区，设置页完整可调。DSH 0.2.2-rc.3 深度适配：面板列表独立滚动、启动器行与宿主逐像素对齐、底部插件入口可选收纳。配置导出/导入走剪贴板、文件与拖放三通道。只改显示层，卸载零残留，兼容区间最宽（DSH >= 0.2.0-rc.1）。安装：dsh plugin add dsh-panel-pins。"
